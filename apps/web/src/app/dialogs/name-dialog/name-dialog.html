<h2 mat-dialog-title>{{ data.title }}</h2>
<form (ngSubmit)="ok()">
  <mat-dialog-content class="body">
    <mat-form-field>
      <mat-label>Maja nimi</mat-label>
      <input matInput name="name" required maxlength="200" [(ngModel)]="name" cdkFocusInitial />
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="null">Loobu</button>
    <button mat-flat-button type="submit" [disabled]="!name.trim()">{{ data.action }}</button>
  </mat-dialog-actions>
</form>
