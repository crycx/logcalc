<h2 mat-dialog-title>Uus parool</h2>
<form (ngSubmit)="submit()" #f="ngForm">
  <mat-dialog-content class="body">
    <p class="who">{{ user.name || user.email }} <span class="meta">{{ user.email }}</span></p>
    <mat-form-field class="pw">
      <mat-label>Uus parool</mat-label>
      <input matInput name="password" type="text" autocomplete="new-password" required minlength="10" [(ngModel)]="password" (ngModelChange)="copied.set(false)" />
      <button mat-icon-button matSuffix type="button" (click)="copy()" [matTooltip]="copied() ? 'Kopeeritud' : 'Kopeeri'" aria-label="Kopeeri parool">
        <mat-icon>{{ copied() ? 'check' : 'content_copy' }}</mat-icon>
      </button>
      <button mat-icon-button matSuffix type="button" (click)="regenerate()" matTooltip="Uus juhuslik parool" aria-label="Genereeri uus parool">
        <mat-icon>autorenew</mat-icon>
      </button>
      <mat-hint>Vähemalt 10 märki. Vana parool lakkab kohe kehtimast.</mat-hint>
    </mat-form-field>
    @if (error()) {
      <p class="err" role="alert">{{ error() }}</p>
    }
  </mat-dialog-content>
  @if (busy()) { <mat-progress-bar mode="indeterminate" /> }
  <mat-dialog-actions align="end">
    <button mat-button type="button" [mat-dialog-close]="null">Loobu</button>
    <button mat-flat-button type="submit" [disabled]="busy() || !f.valid">Määra parool</button>
  </mat-dialog-actions>
</form>
