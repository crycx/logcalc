@for (item of items().controls; track item; let i = $index) {
  <div class="item">
    <mat-form-field class="name">
      <mat-label>Nimi</mat-label>
      <input matInput maxlength="80" [formControl]="item.controls.name" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Laius, mm</mat-label>
      <input matInput type="number" min="0" [formControl]="item.controls.width" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Kõrgus, mm</mat-label>
      <input matInput type="number" min="0" [formControl]="item.controls.height" />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Hind, €/tk</mat-label>
      <input matInput type="number" min="0" step="0.01" [formControl]="item.controls.price" />
    </mat-form-field>
    <button mat-icon-button type="button" (click)="remove(i)" matTooltip="Eemalda" [attr.aria-label]="'Eemalda ' + (item.controls.name.value || 'rida')">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
} @empty {
  <p class="empty">Kataloog on tühi.</p>
}
<button mat-button type="button" (click)="add()">
  <mat-icon>add</mat-icon> {{ addLabel() }}
</button>
