@if (info(); as i) {
  <div class="head">
    <span class="mark">{{ mark() }}</span>
    <span class="title">{{ i.title }}</span>
    <span class="spacer"></span>
    @if (showDetails()) {
      <button mat-button type="button" (click)="details.emit()" matTooltip="Selle tähise detailijoonis (lõiked ja mõõdud)">
        <mat-icon>straighten</mat-icon> Detailijoonis
      </button>
    }
    <button mat-icon-button type="button" (click)="clear.emit()" matTooltip="Tühista valik" aria-label="Tühista valik"><mat-icon>close</mat-icon></button>
  </div>
  <dl class="facts">
    @for (f of i.facts; track f.k) {
      <div>
        <dt>{{ f.k }}</dt>
        <dd>{{ f.v }}</dd>
      </div>
    }
  </dl>
  @if (i.cuts.length) {
    <ul class="cuts">
      @for (c of i.cuts; track $index) {
        <li>{{ c }}</li>
      }
    </ul>
  }
}
