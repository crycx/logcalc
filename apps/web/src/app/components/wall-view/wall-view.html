@let v = view();
<svg [attr.viewBox]="v.viewBox" preserveAspectRatio="xMidYMid meet" role="img" [attr.aria-label]="'Sein ' + wall().id">
  <!-- liidete teljed (ristuvad seinad) -->
  @for (j of v.joints; track $index) {
    <line class="joint" [attr.x1]="j.x" [attr.x2]="j.x" [attr.y1]="-v.fs * 0.6" [attr.y2]="thickness() > 0 ? 0 : v.H" />
    <text class="joint-label" [attr.x]="j.x" [attr.y]="-v.fs * 0.8" [attr.font-size]="v.fs * 0.8" text-anchor="middle">{{ j.wall }}</text>
  }
  @for (r of v.rects; track $index) {
    <rect [class]="r.cls" [class.pickable]="!!r.mark" [attr.x]="r.x" [attr.y]="r.y" [attr.width]="r.w" [attr.height]="r.h" (click)="onPick(r.mark)">
      @if (r.mark) { <title>{{ r.mark }}</title> }
    </rect>
  }
  <!-- viilupalgid katusekalde järgi lõigatud -->
  @for (p of v.polys; track $index) {
    <polygon [class]="p.cls" [class.pickable]="!!p.mark" [attr.points]="p.points" (click)="onPick(p.mark)">
      @if (p.mark) { <title>{{ p.mark }}</title> }
    </polygon>
  }
  @for (o of v.openings; track $index) {
    <rect [class]="'opening ' + o.kind" [attr.x]="o.x" [attr.y]="o.y" [attr.width]="o.w" [attr.height]="o.h" />
    @if (o.kind === 'door') {
      <!-- uks: puit, paneelid, käepide -->
      @for (l of o.leaves; track $index) {
        @if ($index > 0) {
          <line class="door-split" [attr.x1]="l.x" [attr.x2]="l.x" [attr.y1]="o.y" [attr.y2]="o.y + o.h" />
        }
        <rect class="door-panel" [attr.x]="l.x + l.w * 0.2" [attr.y]="o.y + o.h * 0.08" [attr.width]="l.w * 0.6" [attr.height]="o.h * 0.36" />
        <rect class="door-panel" [attr.x]="l.x + l.w * 0.2" [attr.y]="o.y + o.h * 0.52" [attr.width]="l.w * 0.6" [attr.height]="o.h * 0.4" />
        <circle class="door-handle" [attr.cx]="l.hx" [attr.cy]="o.y + o.h * 0.5" [attr.r]="Math.min(l.w, o.h) * 0.04" />
      }
    } @else {
      <!-- aken: klaas, rist -->
      <line class="mullion" [attr.x1]="o.x + o.w / 2" [attr.x2]="o.x + o.w / 2" [attr.y1]="o.y" [attr.y2]="o.y + o.h" />
      <line class="mullion" [attr.x1]="o.x" [attr.x2]="o.x + o.w" [attr.y1]="o.y + o.h / 2" [attr.y2]="o.y + o.h / 2" />
    }
  }
  <!-- sälgud: nurgaliited (rea vahel), pärlinid viilus; ülemise palgi kaldlõike joon -->
  @for (n of v.notchRects; track $index) {
    <rect class="notch" [attr.x]="n.x" [attr.y]="n.y" [attr.width]="n.w" [attr.height]="n.h" />
  }
  @for (p of v.purlinNotches; track $index) {
    <polygon class="notch" [attr.points]="p" />
  }
  @for (b of v.bevels; track $index) {
    <line class="bevel" [attr.x1]="b.x1" [attr.x2]="b.x2" [attr.y1]="b.y" [attr.y2]="b.y" />
  }
  <!-- jätkukohad (pikk sein, vaheseina teljel) -->
  @for (s of v.splices; track $index) {
    <line class="splice" [attr.x1]="s.x" [attr.x2]="s.x" [attr.y1]="s.y" [attr.y2]="s.y + s.h" />
  }
  <line class="ground" [attr.x1]="-v.fs" [attr.x2]="wall().length + v.fs" [attr.y1]="v.H" [attr.y2]="v.H" />
  <g lcDims [dims]="v.dims" [fs]="v.fs * 0.8"></g>
</svg>
