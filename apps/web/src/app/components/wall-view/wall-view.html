@let v = view();
<svg [attr.viewBox]="v.viewBox" preserveAspectRatio="xMidYMid meet" role="img" [attr.aria-label]="'Sein ' + wall().id">
  <!-- liidete teljed (ristuvad seinad) -->
  @for (j of v.joints; track $index) {
    <line class="joint" [attr.x1]="j.x" [attr.x2]="j.x" [attr.y1]="-v.fs * 0.6" [attr.y2]="v.H" />
    <text class="joint-label" [attr.x]="j.x" [attr.y]="-v.fs * 0.8" [attr.font-size]="v.fs * 0.8" text-anchor="middle">{{ j.wall }}</text>
  }
  @for (r of v.rects; track $index) {
    <rect [class]="'log ' + r.kind" [attr.x]="r.x" [attr.y]="r.y" [attr.width]="r.w" [attr.height]="r.h" />
  }
  <!-- viilupalgid katusekalde järgi lõigatud -->
  @for (p of v.polys; track $index) {
    <polygon [class]="'log ' + p.kind" [attr.points]="p.points" />
  }
  @for (o of v.openings; track $index) {
    <rect [class]="'opening ' + o.kind" [attr.x]="o.x" [attr.y]="o.y" [attr.width]="o.w" [attr.height]="o.h" />
    @if (o.kind === 'door') {
      <!-- uks: puit, paneelid, käepide -->
      <rect class="door-panel" [attr.x]="o.x + o.w * 0.12" [attr.y]="o.y + o.h * 0.08" [attr.width]="o.w * 0.76" [attr.height]="o.h * 0.36" />
      <rect class="door-panel" [attr.x]="o.x + o.w * 0.12" [attr.y]="o.y + o.h * 0.52" [attr.width]="o.w * 0.76" [attr.height]="o.h * 0.4" />
      <circle class="door-handle" [attr.cx]="o.x + o.w * 0.86" [attr.cy]="o.y + o.h * 0.5" [attr.r]="Math.min(o.w, o.h) * 0.035" />
    } @else {
      <!-- aken: klaas, rist -->
      <line class="mullion" [attr.x1]="o.x + o.w / 2" [attr.x2]="o.x + o.w / 2" [attr.y1]="o.y" [attr.y2]="o.y + o.h" />
      <line class="mullion" [attr.x1]="o.x" [attr.x2]="o.x + o.w" [attr.y1]="o.y + o.h / 2" [attr.y2]="o.y + o.h / 2" />
    }
  }
  <!-- jätkukohad (pikk sein, vaheseina teljel) -->
  @for (s of v.splices; track $index) {
    <line class="splice" [attr.x1]="s.x" [attr.x2]="s.x" [attr.y1]="s.y" [attr.y2]="s.y + s.h" />
  }
  <line class="ground" [attr.x1]="-v.fs" [attr.x2]="wall().length + v.fs" [attr.y1]="v.H" [attr.y2]="v.H" />
  <g lcDims [dims]="v.dims" [fs]="v.fs * 0.8"></g>
</svg>
