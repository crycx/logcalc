<div class="bar">
  <mat-checkbox [ngModel]="showRoof()" (ngModelChange)="showRoof.set($event)">Katus</mat-checkbox>
  @if (highlight(); as h) {
    <span class="sel"><b>{{ h }}</b> · {{ highlightCount() }} tk</span>
    <button type="button" class="reset" (click)="pick.emit(null)">Tühista valik</button>
  } @else {
    <span class="hint">Lohista pööramiseks, ratas suumib, parem nupp nihutab · klõps palgil näitab tähist</span>
  }
  <button type="button" class="reset" (click)="reset()">Algvaade</button>
</div>
<div class="canvas" #canvasHost>
  @if (loading()) {
    <div class="overlay">Laen 3D vaadet…</div>
  }
  @if (error()) {
    <div class="overlay">{{ error() }}</div>
  }
</div>
